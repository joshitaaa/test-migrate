<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🛍️ E-Commerce Shop</h1>
            <div class="header-actions">
                <button id="viewCart" class="btn btn-primary">
                    🛒 Cart (<span id="cartCount">0</span>)
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="productsSection">
            <h2>Our Products</h2>
            <div id="productsList" class="products-grid">
                <!-- Products will be loaded here -->
            </div>
        </section>

        <section id="cartSection" style="display: none;">
            <div class="cart-header">
                <h2>Shopping Cart</h2>
                <button id="backToProducts" class="btn btn-secondary">← Back to Products</button>
            </div>
            <div id="cartItems" class="cart-items">
                <!-- Cart items will be loaded here -->
            </div>
            <div id="cartTotal" class="cart-total">
                <!-- Total will be displayed here -->
            </div>
            <div id="cartActions" class="cart-actions">
                <button id="clearCart" class="btn btn-secondary">Clear Cart</button>
                <button id="checkout" class="btn btn-success">Proceed to Checkout</button>
            </div>
        </section>

        <section id="checkoutSection" style="display: none;">
            <div class="checkout-header">
                <h2>Checkout</h2>
                <button id="backToCart" class="btn btn-secondary">← Back to Cart</button>
            </div>
            <div class="checkout-form">
                <h3>Shipping Information</h3>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea id="address" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label for="zipCode">Zip Code</label>
                        <input type="text" id="zipCode" required>
                    </div>
                    <div id="checkoutTotal" class="checkout-total">
                        <!-- Total will be displayed here -->
                    </div>
                    <button type="submit" class="btn btn-success">Place Order</button>
                </form>
            </div>
        </section>
    </main>

    <div id="notification" class="notification"></div>

    <script src="app.js"></script>
</body>
</html>
